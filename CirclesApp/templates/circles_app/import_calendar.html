{% extends 'base.html' %}
{% block title %}Import Calendar{% endblock %}
{% block content %}
    <h2>Import from Google Calendar</h2>
    <p>In Google Calendar: Settings → (pick a calendar) → Export. Unzip and upload the .ics file here.</p>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Import</button>
    </form>
{% endblock %}
