{% extends 'base.html' %}
{% block title %}Quick Add Event{% endblock %}
{% block content %}
    <h2 class="text-2xl font-light mb-4">Add an event directly to {{ circle.circle_name }}</h2>
    <p class="opacity-70 mb-4">This skips voting and adds the event to every member's calendar immediately.</p>
    <form method="POST" class="styled-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Add for Everyone</button>
    </form>
{% endblock %}
