{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card bg-base-100 w-full max-w-md mx-auto mt-10">
  <form method="POST" action="{% url 'login' %}" class="card-body gap-3">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <h1 class="text-3xl font-light mb-2">Welcome back</h1>

    <label class="block">
      <span class="text-sm mb-1 block">Username</span>
      <input type="text" name="username" id="username" class="input w-full" required>
    </label>

    <label class="block">
      <span class="text-sm mb-1 block">Password</span>
      <input type="password" name="password" id="password" class="input w-full" required>
    </label>

    {% if error %}
      <div role="alert" class="alert alert-error rounded-2xl"><span>{{ error }}</span></div>
    {% endif %}

    <button type="submit" class="btn btn-primary w-full mt-2">Login</button>

    <p class="text-sm text-center">
      Don't have an account?
      <a href="{% url 'register' %}" class="link font-medium">Register here</a>
    </p>
  </form>
</div>
{% endblock %}
