{% extends 'base.html' %}
{% block title %}Logout{% endblock %}
{% block content %}
<div class="card bg-base-100 w-full max-w-md mx-auto mt-10 text-center">
    <form method="POST" action="{% url 'logout' %}" class="card-body items-center gap-3">
        {% csrf_token %}
        <h1 class="text-3xl font-light">Logout</h1>
        <p class="opacity-70">Are you sure you want to logout?</p>
        <div class="flex gap-2 w-full mt-2">
            <a href="{% url 'home' %}" class="btn flex-1">Cancel</a>
            <button type="submit" class="btn btn-neutral flex-1">Logout</button>
        </div>
    </form>
</div>
{% endblock %}
