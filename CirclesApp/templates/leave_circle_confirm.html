{% extends 'base.html' %}
{% block title %}Leave Circle{% endblock %}
{% block content %}
    <h2>Leave "{{ circle.circle_name }}"?</h2>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, leave</button>
    </form>
    <a href="{% url 'circle_detail' circle.id %}">Cancel</a>
{% endblock %}
