{% extends 'base.html' %}
{% block title %}Delete Event{% endblock %}
{% block content %}
    <h2>Delete "{{ event.event_name }}"?</h2>
    <p>{{ event.start_time|date:"M d, Y H:i" }} to {{ event.end_time|date:"M d, Y H:i" }}</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete it</button>
    </form>
    <a href="{% url 'calendar' %}">Cancel</a>
{% endblock %}
