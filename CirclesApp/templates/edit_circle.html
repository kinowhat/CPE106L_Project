{% extends 'base.html' %}
{% block title %}Edit Circle{% endblock %}
{% block content %}
    <h2>Edit {{ circle.circle_name }}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
    <a href="{% url 'circle_detail' circle.id %}">Back</a>
{% endblock %}
