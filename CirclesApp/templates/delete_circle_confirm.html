{% load static %}
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Delete Circle</title>
<link rel="stylesheet" href="{% static 'styles/styles.css' %}"></head>
<body>
    <h2>Delete "{{ circle.circle_name }}"?</h2>
    <p>This will remove the circle for every member and delete all its shared events.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete it</button>
    </form>
    <a href="{% url 'circle_detail' circle.id %}">Cancel</a>
</body></html>
